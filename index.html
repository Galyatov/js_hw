<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Хрестики-Нулики</title>
        <style>
            #board {
                display: grid;
                grid-template-columns: repeat(3, 100px);
                grid-template-rows: repeat(3, 100px);
                gap: 5px;
                margin-bottom: 20px;
            }
            .cell {
                width: 100px;
                height: 100px;
                font-size: 40px;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: #f0f0f0;
                border: 1px solid #333;
                cursor: pointer;
            }
            .cell.disabled {
                pointer-events: none;
                background-color: #ddd;
            }
            #status {
                font-size: 18px;
                margin-bottom: 20px;
            }
            #restart {
                padding: 10px 20px;
                font-size: 18px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <h1>Гра: Хрестики-Нулики</h1>
        <div id="status">Ваш хід</div>
        <div id="board"></div>
        <button id="restart">Перезапустити гру</button>
        <script src="./js/script.js"></script>
    </body>
</html>
